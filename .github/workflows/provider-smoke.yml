name: provider-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -c requirements.lock . openai
      - name: Check OpenAI directly
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl --silent --show-error --fail-with-body \
            --connect-timeout 10 \
            --max-time 30 \
            https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{
              "model": "gpt-4.1-mini-2025-04-14",
              "messages": [
                {"role": "user", "content": "Reply with OK"}
              ],
              "max_tokens": 8
            }'
      - name: Call provider and verify
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p .integrity

          eit freeze \
            --dataset examples/dataset.jsonl \
            --model openai/gpt-4.1-mini-2025-04-14 \
            --count 1 \
            --epochs 1 \
            --max-tokens 32 \
            --out .integrity/manifest.json \
            > .integrity/freeze.json

          DIGEST=$(python -c 'import json; print(json.load(open(".integrity/freeze.json"))["sha256"])')

          eit run \
            --manifest .integrity/manifest.json \
            --expected-digest "$DIGEST" \
            --log-dir .integrity/provider-logs
